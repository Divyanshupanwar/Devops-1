services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: newpassword
      POSTGRES_DB: project1
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d project1"]
      interval: 5s
      timeout: 5s
      retries: 10

  user_app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: "postgresql://postgres:newpassword@postgres:5432/project1?schema=public"
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy